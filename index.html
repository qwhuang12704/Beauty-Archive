<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf0f3">
<title>Beauty Archive</title>
<style>
:root{--bg:#eaf0f3;--card:#f4f7f8;--ink:#344b5c;--muted:#7c8e9a;--line:#ccd6dc;--accent:#668a70;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}
.top{padding:26px 22px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.today{font:12px Arial,sans-serif;color:var(--muted)}
main{padding:10px 20px 30px}.heading{font-size:36px;font-weight:400;letter-spacing:-.04em;margin:10px 0 4px}.sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:20px;overflow:auto;white-space:nowrap;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:12px}.tab{background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px}.tab.active{color:var(--ink);border-bottom:1px solid var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0 20px}.search{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;font-size:13px;outline:none}.sort{max-width:125px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 0;font-size:13px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:24px;padding:10px 15px;font:12px Arial,sans-serif}.btn.primary{background:var(--ink);color:white}.btn.small{padding:7px 10px}.btn.ghost{border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}.product{min-width:0}.product-image{aspect-ratio:1/1;background:#e0e7e2;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.product-image img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:44px;color:#a9b7c0}.category-label{font-size:11px;color:var(--muted);margin:0 0 8px}.product-name{text-align:center;font-size:22px;line-height:1.25;margin:12px 0 2px;overflow-wrap:anywhere}.product-shade{text-align:center;font-size:17px;margin:0 0 10px;overflow-wrap:anywhere}.product-meta{text-align:center;font-size:12px;color:var(--muted);line-height:1.7}.product-actions{display:flex;gap:6px;justify-content:center;margin-top:9px}.product-actions button{border:0;background:none;color:var(--muted);font:11px Arial,sans-serif;text-decoration:underline;padding:4px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);line-height:1.7}
.section-title{font-size:22px;font-weight:400;margin:18px 0 12px}.panel{background:rgba(255,255,255,.42);padding:15px;border:1px solid rgba(204,214,220,.65);margin-bottom:14px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font:12px Arial,sans-serif;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.5);padding:11px;border-radius:2px;font:14px Arial,sans-serif;color:var(--ink);outline:none}.field textarea{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.hidden{display:none!important}
.dashboard-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 30px;padding:8px 0 18px;border-bottom:1px solid var(--line)}
.dashboard-top .heading{font-size:36px;margin:0;line-height:1.2}.dashboard-top>div:first-child{min-width:0}.dashboard-actions{align-items:center}.dashboard-actions{display:flex;gap:8px;flex-wrap:wrap}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin:24px 0}
.dash-stat{padding:12px 0 18px;border-bottom:1px solid var(--line)}.dash-label{font-size:13px;color:var(--muted);margin-bottom:16px}
.dash-number{font-size:40px;line-height:1.05}.dash-unit{font-size:12px;color:var(--muted);margin-left:5px}
.dash-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
.subhead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}.subhead h2{font-size:20px;font-weight:400;margin:0}
.mini-products{display:flex;gap:14px;overflow:auto;padding:4px 0 12px}.mini-product{width:92px;flex:0 0 92px;text-align:center;font-size:12px}
.mini-image{height:78px;background:#e0e7e2;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}.mini-image img{width:100%;height:100%;object-fit:contain}
.reminder-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}
.palette-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.palette{border:1px solid var(--line);background:transparent;padding:8px;text-align:left}
.palette.active{outline:1px solid var(--ink)}.swatches{display:flex;height:34px;margin-bottom:8px}.swatches span{flex:1}.palette-name{font-size:12px}
.segmented{display:flex;gap:18px;margin:14px 0}.segmented button{background:none;border:0;padding:8px 0;color:var(--muted);border-bottom:1px solid transparent}.segmented button.active{color:var(--ink);border-color:var(--ink)}
@media(min-width:600px){.dashboard-top .heading{font-size:42px}.dash-grid{gap:24px 32px}}
@media(max-width:420px){main{padding-left:18px;padding-right:18px}.dashboard-top{gap:8px;margin-bottom:26px}.dashboard-top .heading{font-size:31px}.dashboard-actions .btn{padding:9px 11px}.dash-grid{gap:22px 18px}.dash-stat{padding:14px 0 20px}.subhead{margin:32px 0 16px}.panel{padding:18px}}
.entry{padding:14px 0;border-bottom:1px solid var(--line)}.entry-date{font-size:12px;color:var(--muted);margin-bottom:5px}.entry-title{font-size:20px;margin-bottom:5px}.entry-notes{font-size:13px;line-height:1.6;white-space:pre-wrap}.entry-photos{display:flex;gap:8px;overflow:auto;margin-top:10px}.entry-photos img{width:90px;height:90px;object-fit:cover;background:#e0e7e2}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 15px}.calendar-month{font-size:22px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day-name{text-align:center;font:10px Arial,sans-serif;color:var(--muted);padding:7px 0}.day{aspect-ratio:1/1;border:0;background:rgba(255,255,255,.45);font:12px Arial,sans-serif;position:relative}.day.muted{opacity:.35}.day.selected{outline:1px solid var(--ink)}.day.has-entry:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:5px;left:calc(50% - 2.5px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;background:rgba(255,255,255,.48);border:1px solid rgba(204,214,220,.65)}.stat-number{font-size:30px;margin:0 0 4px}.stat-label{font:11px Arial,sans-serif;color:var(--muted)}.barrow{display:grid;grid-template-columns:minmax(70px,1fr) 2fr 28px;align-items:center;gap:8px;margin:12px 0;font:12px Arial,sans-serif}.bar{height:7px;background:#d1dcd5}.bar span{display:block;height:100%;background:#8ea3b0}.notice{font:12px Arial,sans-serif;color:var(--muted);line-height:1.5;padding:12px;background:rgba(255,255,255,.35);margin-top:16px}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(237,241,238,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:auto}
.navbtn{border:0;background:none;color:var(--muted);font-size:11px;display:flex;align-items:center;flex-direction:column;gap:5px;padding:4px}.navbtn .ico{font:20px Arial,sans-serif}.navbtn.active{color:var(--ink)}.navbtn.active:after{content:"";width:20px;height:1px;background:var(--ink)}
.modal-backdrop{position:fixed;inset:0;z-index:10;background:#263b4b66;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:var(--bg);width:100%;max-width:650px;max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 4px 40px #22334420}.modal-top{display:flex;justify-content:space-between;align-items:center}.modal-title{font-size:26px;font-weight:400;margin:0}.close{border:0;background:none;font-size:25px;color:var(--muted)}.photo-preview{display:flex;gap:8px;flex-wrap:wrap}.photo-preview img{width:70px;height:70px;object-fit:cover}
@media(min-width:600px){main{padding-left:30px;padding-right:30px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}.heading{font-size:42px}.modal-backdrop{align-items:center}}
</style>

<div id="authPanel" style="padding:24px; max-width:420px; margin:40px auto; font-family:Arial,sans-serif;">
  <h2>Beauty Archive</h2>
  <p>Sign in to sync your beauty archive across devices.</p>
  <label for="authEmail">Email</label>
  <input id="authEmail" type="email" autocomplete="email" placeholder="Your email" style="display:block; width:100%; box-sizing:border-box; padding:10px; margin:8px 0 16px;">
  <label for="authPassword">Password</label>
  <input id="authPassword" type="password" autocomplete="current-password" placeholder="Your password" style="display:block; width:100%; box-sizing:border-box; padding:10px; margin:8px 0 16px;">
  <button id="signInBtn" type="button">Sign in</button>

<div class="app">
<header class="top"><div class="brand">Beauty Archive</div><div class="today" id="todayLabel"></div></header>
<main id="main"></main>
<nav>
<button class="navbtn active" data-page="journal"><span class="ico">▤</span>Journal</button>
<button class="navbtn" data-page="collection"><span class="ico">▣</span>Collection</button>
<button class="navbtn" data-page="calendar"><span class="ico">▦</span>Calendar</button>
<button class="navbtn" data-page="insights"><span class="ico">▥</span>Insights</button><button class="navbtn" data-page="account"><span class="ico">♙</span>Account</button>
</nav>

<div id="modalRoot"></div>
<script>
const CATEGORIES=["Eyeshadow","Blush","Lipstick","Foundation","Other"];
const DB_NAME="beauty-archive-db", STORE="photos";
let db, page="journal", category="All", searchTerm="", sortBy="newest", selectedDate=localDate(), calMonth=new Date(), insightPeriod="month", themeName=load("ba-theme","green"), activeUser=null;
const CLOUD_TABLE="beauty_archive_data", PHOTO_BUCKET="beauty-archive-photos";
let cloudReady=false, cloudBusy=false, cloudPending=false, applyingCloud=false, cloudTimer=null, cloudUserId=null, cloudBootstrapPromise=null, syncStatus="Not synced";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function prettyDate(s){if(!s)return "";const d=new Date(s+"T12:00:00");return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function load(key,def){try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val));if(["ba-products","ba-entries","ba-theme"].includes(key))scheduleCloudSync()}
let products=load("ba-products",[]), entries=load("ba-entries",[]);
function syncFirstUseDates(){
 const firstDates={};
 entries.forEach(e=>{if(!e.date)return;(e.productIds||[]).forEach(id=>{if(!firstDates[id]||e.date<firstDates[id])firstDates[id]=e.date})});
 let changed=false;
 products.forEach(p=>{const date=firstDates[p.id]||"";if((p.firstUseDate||"")!==date){p.firstUseDate=date;changed=true}});
 if(changed)save("ba-products",products);
}
function initDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}
function putPhoto(id,blob){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function getPhoto(id){return new Promise(resolve=>{if(!id||!db)return resolve("");const req=db.transaction(STORE).objectStore(STORE).get(id);req.onsuccess=()=>{if(req.result){const url=URL.createObjectURL(req.result);resolve(url)}else resolve("")};req.onerror=()=>resolve("")})}
function delPhoto(id){if(!id||!db)return;db.transaction(STORE,"readwrite").objectStore(STORE).delete(id)}
async function photoHTML(id,cls=""){const url=await getPhoto(id);return url?`<img class="${cls}" src="${url}" alt="">`:""}

const THEMES={
 blue:{name:"雾霾蓝",bg:"#EAF0F4",ink:"#566875",muted:"#8A9BA6",line:"#D8E1E7",swatches:["#566875","#8A9BA6","#C7D5DE","#EAF0F4","#FBFCFD"]},
 pink:{name:"灰调粉",bg:"#F3E9EC",ink:"#705D63",muted:"#B49AA2",line:"#E4D6DB",swatches:["#705D63","#B49AA2","#D8C2C9","#F3E9EC","#FDFBFC"]},
 purple:{name:"薰衣草紫",bg:"#F0ECF5",ink:"#625B72",muted:"#A197B3",line:"#E0DAE9",swatches:["#625B72","#A197B3","#D2C9DF","#F0ECF5","#FDFBFE"]},
 green:{name:"鼠尾草绿",bg:"#EAF0E8",ink:"#566758",muted:"#8B9D8B",line:"#D8E2D6",swatches:["#566758","#8B9D8B","#C8D6C5","#EAF0E8","#FBFCF9"]},
 grey:{name:"雾感灰",bg:"#EFF0F0",ink:"#5D6262",muted:"#909596",line:"#DDE0E0",swatches:["#5D6262","#909596","#CDD0D0","#EFF0F0","#FDFDFD"]}
};
if(!THEMES[themeName]){themeName="green";save("ba-theme",themeName)}
function applyTheme(){const t=THEMES[themeName]||THEMES.green;for(const k of ["bg","ink","muted","line"])document.documentElement.style.setProperty("--"+k,t[k]);document.querySelector('meta[name="theme-color"]').content=t.bg;document.body.style.background=t.bg}

async function render(){ syncFirstUseDates(); applyTheme(); $("#todayLabel").textContent=new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"});document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const root=$("#main");if(page==="collection")root.innerHTML=await collectionHTML();else if(page==="journal")root.innerHTML=await journalHTML();else if(page==="calendar")root.innerHTML=await calendarHTML();else if(page==="insights")root.innerHTML=insightsHTML();else if(page==="account")root.innerHTML=accountHTML();else root.innerHTML=settingsHTML();bindPage()}
function shell(title,sub,body){return `<h1 class="heading">${title}</h1><p class="sub">${sub}</p>${body}`}
async function collectionHTML(){let shown=products.filter(p=>(category==="All"||p.category===category)&&(`${p.brand} ${p.name} ${p.shade} ${p.category}`).toLowerCase().includes(searchTerm.toLowerCase()));shown.sort((a,b)=>sortBy==="name"?a.name.localeCompare(b.name):sortBy==="uses"?(b.uses||0)-(a.uses||0):((a.firstUseDate?0:1)-(b.firstUseDate?0:1)||(b.firstUseDate||"").localeCompare(a.firstUseDate||"")));let cards="";for(const p of shown){const img=await photoHTML(p.photo);cards+=`<article class="product"><div class="category-label">${esc(p.category)}</div><div class="product-image">${img||`<span class="placeholder">✧</span>`}</div><div class="product-name">${esc(p.brand||"")}</div><div class="product-shade">${esc(p.name)}${p.shade?` · ${esc(p.shade)}`:""}</div><div class="product-meta">${p.uses||0} uses<br>${p.lastUsed?esc(prettyDate(p.lastUsed)):"Not used yet"}</div><div class="product-actions"><button data-use="${p.id}">Log use</button><button data-edit="${p.id}">Edit</button><button data-delete="${p.id}">Delete</button></div></article>`}
return shell("My collection",`${products.length} ${products.length===1?"item":"items"}`,`<div class="tabs">${["All",...CATEGORIES].map(c=>`<button class="tab ${category===c?"active":""}" data-cat="${c}">${c}</button>`).join("")}</div><div class="toolbar"><input class="search" id="search" placeholder="Search my collection..." value="${esc(searchTerm)}"><select class="sort" id="sort"><option value="newest" ${sortBy==="newest"?"selected":""}>Newest</option><option value="name" ${sortBy==="name"?"selected":""}>Name A–Z</option><option value="uses" ${sortBy==="uses"?"selected":""}>Most used</option></select></div><div style="display:flex;justify-content:flex-end;margin:-4px 0 18px"><button class="btn primary" id="addProduct">+ Add ${category==="All"?"product":esc(category.toLowerCase())}</button></div>${shown.length?`<div class="grid">${cards}</div>`:`<div class="empty">${products.length?"No products match your search.":"Your collection starts here. Add your first product to begin."}</div>`}`)}
async function journalHTML(){
const today=localDate(),monthPrefix=today.slice(0,7),todayEntries=entries.filter(e=>e.date===today),monthEntries=entries.filter(e=>e.date.startsWith(monthPrefix));
const monthUses=new Set(monthEntries.flatMap(e=>(e.productIds||[]).map(id=>e.date+"|"+id))).size;
const totalUses=new Set(entries.flatMap(e=>(e.productIds||[]).map(id=>e.date+"|"+id))).size;
const finished=products.filter(p=>p.finished).length;
let cards="";
for(const id of [...new Set(todayEntries.flatMap(e=>e.productIds||[]))]){const p=products.find(x=>x.id===id);if(!p)continue;const img=await photoHTML(p.photo);cards+=`<div class="mini-product"><div class="mini-image">${img||"✧"}</div><div class="mini-name">${esc(p.name)}</div><div class="category-label">${esc(p.category)}</div></div>`}
const unused=products.filter(p=>!(p.uses||0));
const opened=products.filter(p=>p.openedDate&&!p.finished&&p.expiryMonths);
const recent=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
return `<div class="dashboard-top"><div><h1 class="heading">My Journal</h1></div><div class="dashboard-actions"><button class="btn primary" id="addEntry">+ Log today's look</button><button class="btn small ghost" id="openSettings">⚙</button></div></div>
<p class="sub">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})} · A little time for yourself.</p>
<div class="dash-grid">
<div class="dash-stat"><div class="dash-label">My Makeup</div><div><span class="dash-number">${products.length}</span><span class="dash-unit">items</span></div><div class="dash-note">Finished ${finished} · Total ${products.length}</div></div>
<div class="dash-stat"><div class="dash-label">This Month</div><div><span class="dash-number">${monthUses}</span><span class="dash-unit">uses</span></div><div class="dash-note">Logged on ${new Set(monthEntries.map(e=>e.date)).size} days this month</div></div>
<div class="dash-stat"><div class="dash-label">Total Uses</div><div><span class="dash-number">${totalUses}</span><span class="dash-unit">uses</span></div><div class="dash-note">Each product counts once per day.</div></div>
<div class="dash-stat"><div class="dash-label">Hit Pan / Finished</div><div><span class="dash-number">${finished}</span><span class="dash-unit">items</span></div><div class="dash-note">Small traces of well-loved makeup.</div></div></div>
<div class="subhead"><h2>Today's makeup</h2><button class="btn small ghost" id="editToday">Edit ↗</button></div>
${cards?`<div class="mini-products">${cards}</div>`:`<div class="empty">No makeup logged today yet.<br>Record today's look to see your products here.</div>`}
<div class="subhead"><h2>Drawer reminders</h2><span class="category-label">A gentle nudge</span></div>
<div class="panel"><div class="reminder-row"><span>Products not used yet</span><button class="btn small ghost" id="unusedReminder">${unused.length} items ↗</button></div><div class="reminder-row"><span>Opened products to check</span><button class="btn small ghost" id="expiryReminder">${opened.length} items ↗</button></div><div id="reminderDetails"></div></div>
<div class="subhead"><h2>Recent journal</h2></div>
${recent.map(e=>`<div class="entry"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="entry-date">${esc(prettyDate(e.date))}</div><button class="btn small ghost" data-edit-entry="${e.id}">Edit</button></div><div class="entry-title">${esc(e.title||"Daily makeup")}</div><div class="entry-notes">${esc(e.notes||"")}</div></div>`).join("")||`<div class="empty">Your journal entries will appear here.</div>`}`;
}
async function calendarHTML() {
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(year, month + 1, 0).getDate();

  const activeDates = new Set(entries.map(e => e.date));
  let cells = "";

  for (let i = 0; i < offset; i++) {
    cells += `<button class="day muted" disabled></button>`;
  }

  for (let d = 1; d <= days; d++) {
    const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    cells += `<button class="day ${date === selectedDate ? "selected" : ""} ${activeDates.has(date) ? "has-entry" : ""}" data-date="${date}">${d}</button>`;
  }

  const selected = entries.filter(e => e.date === selectedDate);
  const entryCards = await Promise.all(
    selected.map(async e => {
      const photos = await Promise.all(
        (e.photos || []).map(id => photoHTML(id))
      );

      return `<div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">

function referencedPhotoIds(payload){const ids=new Set();(payload.products||[]).forEach(p=>{if(p.photo)ids.add(p.photo)});(payload.entries||[]).forEach(e=>(e.photos||[]).forEach(id=>ids.add(id)));return [...ids]}
async function uploadPhotos(userId,payload){for(const id of referencedPhotoIds(payload)){const blob=await readPhotoBlob(id);if(!blob)throw new Error(`A referenced photo is missing on this device: ${id}. Restore a backup before syncing.`);const path=`${userId}/${id}`;const {error}=await supabaseClient.storage.from(PHOTO_BUCKET).upload(path,blob,{upsert:true,contentType:blob.type||"application/octet-stream"});if(error)throw error}}
async function syncToCloud(){if(!cloudReady||!activeUser)return;if(cloudBusy){cloudPending=true;return}cloudBusy=true;setSyncStatus("Syncing…");try{do{cloudPending=false;const payload=currentPayload();await uploadPhotos(activeUser.id,payload);const {error}=await supabaseClient.from(CLOUD_TABLE).upsert({user_id:activeUser.id,payload,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error}while(cloudPending);setSyncStatus("Synced just now")}catch(err){console.error("Beauty Archive cloud sync failed",err);setSyncStatus("Sync failed — check connection / setup")}finally{cloudBusy=false;if(cloudPending){cloudPending=false;scheduleCloudSync()}}}
async function replaceLocalPhotos(photoBlobs){return new Promise((resolve,reject)=>{if(!db)return reject(new Error("Photo storage unavailable"));const tx=db.transaction(STORE,"readwrite"),store=tx.objectStore(STORE);store.clear();photoBlobs.forEach(({id,blob})=>store.put(blob,id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("Photo update failed"))})}
async function downloadCloudPayload(userId,payload){if(!payload||!Array.isArray(payload.products)||!Array.isArray(payload.entries))throw new Error("Cloud data format is invalid");const blobs=[];for(const id of referencedPhotoIds(payload)){const {data,error}=await supabaseClient.storage.from(PHOTO_BUCKET).download(`${userId}/${id}`);if(error)throw new Error(`Could not download photo ${id}: ${error.message}`);blobs.push({id,blob:data})}await replaceLocalPhotos(blobs);applyingCloud=true;try{products=payload.products;entries=payload.entries;themeName=THEMES[payload.theme]?payload.theme:"green";localStorage.setItem("ba-products",JSON.stringify(products));localStorage.setItem("ba-entries",JSON.stringify(entries));localStorage.setItem("ba-theme",JSON.stringify(themeName));syncFirstUseDates()}finally{applyingCloud=false}}
async function bootstrapCloudSync(user){if(!user)return;if(cloudUserId===user.id&&cloudReady)return;if(cloudUserId===user.id&&cloudBootstrapPromise)return cloudBootstrapPromise;cloudReady=false;cloudUserId=user.id;setSyncStatus("Connecting to cloud…");cloudBootstrapPromise=(async()=>{try{const {data,error}=await supabaseClient.from(CLOUD_TABLE).select("payload").eq("user_id",user.id).maybeSingle();if(error)throw error;if(data&&data.payload){await downloadCloudPayload(user.id,data.payload);cloudReady=true;setSyncStatus("Loaded from cloud");await render()}else{cloudReady=true;setSyncStatus("Uploading this device’s data…");await syncToCloud();await render()}}catch(err){console.error("Beauty Archive cloud setup/load failed",err);cloudReady=false;setSyncStatus("Cloud setup required or sync failed");if(page==="account")await render()}finally{cloudBootstrapPromise=null}})();return cloudBootstrapPromise}

document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
initDB().then(render).catch(()=>{render();alert("Photo storage is unavailable in this browser. Text records may still work.")});
</script>
<script>
const authPanel = document.getElementById("authPanel");
const authMessage = document.getElementById("authMessage");
const appPanel = document.querySelector(".app");

async function updateAuthView() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  authPanel.style.display = session ? "none" : "block";
  appPanel.style.display = session ? "block" : "none";
  activeUser = session?.user || null;
  if(session) await bootstrapCloudSync(session.user);
  else {cloudReady=false;cloudUserId=null;setSyncStatus("Not signed in");}
}

document.getElementById("signInBtn").addEventListener("click", async () => {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  if(!email||!password){authMessage.textContent="Enter your email and password first.";return;}
   authMessage.textContent = "Signing in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  authMessage.textContent = "";
  await updateAuthView();
});

document.getElementById("signUpBtn").addEventListener("click", async () => {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  if(!email||!password){authMessage.textContent="Enter your email and password first.";return;}
   authMessage.textContent = "Creating account...";

  const { error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  authMessage.textContent = error
    ? error.message
    : "Account created. Check your email if confirmation is required.";
});

supabaseClient.auth.onAuthStateChange((_event, session) => {
  if(session) { activeUser=session.user; updateAuthView(); }
  else { activeUser=null; cloudReady=false; cloudUserId=null; updateAuthView(); }
});

updateAuthView();
</script>
</body>
